[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hayday-automation"
version = "0.1.1"
description = "A Python desktop workspace for Hay Day on BlueStacks and MuMu Player"
readme = "README (IMPORTANT INSTRUCTIONS).txt"
requires-python = ">=3.11"
dependencies = [
  "flet==0.86.0",
  "flet-desktop==0.86.0; platform_system == 'Windows' or platform_system == 'Darwin'",
  "pyobjc-framework-Vision==11.1; platform_system == 'Darwin'",
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "opencv-python>=4.12,<5",
  "comtypes==1.4.16; platform_system == 'Windows'",
  "winrt-runtime==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Foundation.Collections==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Globalization==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Graphics.Imaging==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Media.Ocr==3.2.1; platform_system == 'Windows'",
  "winrt-Windows.Storage.Streams==3.2.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
build = ["pyinstaller==6.22.2", "pyinstaller-hooks-contrib==2026.7"]

[project.gui-scripts]
hayday-automation = "hayday.ui:run"

[tool.hatch.build.targets.wheel]
packages = ["src/hayday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
